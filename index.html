<!doctype html>
<html lang="en" data-theme="colts">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NFL Matrix</title>
<style>
/* ---------- themes ---------- */
:root, [data-theme="colts"]{
  --bg:#0b1a30; --bg-2:#10223d; --bg-3:#172d4d; --bg-head:#132743;
  --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.055);
  --text:#dfe6ef; --muted:#8fa2b8; --accent:#6fa8dc; --accent-ink:#0b1a30;
  --best:#ffffff; --zebra:rgba(255,255,255,.028); --sel:rgba(111,168,220,.14); --warn:#d9b35c;
  --stripe:rgba(255,255,255,.035);
}
[data-theme="slate"]{
  --bg:#15171a; --bg-2:#1c1f23; --bg-3:#25292f; --bg-head:#202429;
  --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.05);
  --text:#e3e6ea; --muted:#8e959e; --accent:#7cc0ff; --accent-ink:#0f1215;
  --best:#ffffff; --zebra:rgba(255,255,255,.03); --sel:rgba(124,192,255,.14); --warn:#e0b458;
  --stripe:transparent;
}
[data-theme="broadcast"]{
  --bg:#0c0c0e; --bg-2:#141417; --bg-3:#1d1d22; --bg-head:#19191e;
  --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.05);
  --text:#ececec; --muted:#8d8d94; --accent:#e34b4b; --accent-ink:#ffffff;
  --best:#ffffff; --zebra:rgba(255,255,255,.03); --sel:rgba(227,75,75,.16); --warn:#e0b458;
  --stripe:transparent;
}
[data-theme="turf"]{
  --bg:#0f1f14; --bg-2:#15281b; --bg-3:#1d3524; --bg-head:#1a3020;
  --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.05);
  --text:#e2ebe4; --muted:#8fa896; --accent:#cfe36a; --accent-ink:#0f1f14;
  --best:#ffffff; --zebra:rgba(255,255,255,.03); --sel:rgba(207,227,106,.14); --warn:#e0b458;
  --stripe:rgba(255,255,255,.04);
}
[data-theme="paper"]{
  --bg:#f3f1ec; --bg-2:#ffffff; --bg-3:#ebe8e1; --bg-head:#f0ede6;
  --line:rgba(0,0,0,.12); --line-soft:rgba(0,0,0,.06);
  --text:#1f2329; --muted:#6a7280; --accent:#1f5fa8; --accent-ink:#ffffff;
  --best:#000000; --zebra:rgba(0,0,0,.025); --sel:rgba(31,95,168,.10); --warn:#9a6b00;
  --stripe:transparent;
}

/* ---------- base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  min-height:100%;color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  background:repeating-linear-gradient(90deg,transparent 0 79px,var(--stripe) 79px 80px),var(--bg);
  background-attachment:fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{display:block}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.top h1{font-size:18px;font-weight:700}
.top .meta{color:var(--muted);font-size:13px}
.top .note{color:var(--warn);font-size:13px}
.top .spacer{flex:1}
.themes{display:flex;gap:6px;align-items:center}
.themes .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:var(--accent)}
.sw[data-t="colts"]{background:linear-gradient(135deg,#0b1a30 50%,#6fa8dc 50%)}
.sw[data-t="slate"]{background:linear-gradient(135deg,#15171a 50%,#7cc0ff 50%)}
.sw[data-t="broadcast"]{background:linear-gradient(135deg,#0c0c0e 50%,#e34b4b 50%)}
.sw[data-t="turf"]{background:linear-gradient(135deg,#0f1f14 50%,#cfe36a 50%)}
.sw[data-t="paper"]{background:linear-gradient(135deg,#f3f1ec 50%,#1f5fa8 50%)}

/* ---------- controls ---------- */
.controls{padding:12px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg-2)}
.seg button{padding:8px 14px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px}
.field .lbl{font-size:12px;color:var(--muted)}
.search{position:relative;flex:1;min-width:260px}
.search input{width:100%;padding:9px 12px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line);color:var(--text);-webkit-appearance:none}
.search input::placeholder{color:var(--muted)}
.drop{position:absolute;left:0;right:0;top:100%;margin-top:6px;z-index:20;display:none;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;max-height:46vh;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.drop.open{display:block}
.drop button{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.drop button:last-child{border-bottom:0}
.drop button:hover,.drop button.cur{background:var(--sel)}
.drop .m{color:var(--muted);font-size:13px}
.drop .m b{color:var(--text);font-weight:500;margin-right:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:13px;background:var(--bg-2)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
select{padding:8px 10px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line);color:var(--text)}
.games{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 16px 10px}
.games button{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line);white-space:nowrap}
.games button:hover{border-color:var(--accent)}
.games .t{display:flex;align-items:center;gap:4px}
.games .m{color:var(--muted);font-size:12px}
.btn{padding:8px 13px;border-radius:8px;border:1px solid var(--line);color:var(--text);background:var(--bg-2)}
.btn:hover{border-color:var(--accent)}

/* ---------- logos ---------- */
.logo{width:24px;height:24px;object-fit:contain;flex:0 0 auto}
.logo.lg{width:36px;height:36px}
.logo.sm{width:18px;height:18px}
.abbr{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:10px;font-weight:700;color:#fff;flex:0 0 auto}

/* ---------- table ---------- */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 16px 8px}
.bar .hint{color:var(--muted);font-size:13px}
.bar .spacer{flex:1}
.wrap{margin:0 16px 28px;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--bg-2)}
table{border-collapse:separate;border-spacing:0;min-width:100%;white-space:nowrap}
th,td{padding:9px 14px;text-align:right;border-bottom:1px solid var(--line-soft);vertical-align:middle}
thead th{position:sticky;top:0;z-index:5;background:var(--bg-head);font-weight:600;border-bottom:1px solid var(--line);min-width:150px}
th:first-child,td:first-child{position:sticky;left:0;z-index:4;text-align:left;min-width:210px;background:var(--bg-2)}
thead th:first-child{z-index:6;background:var(--bg-head);color:var(--muted);font-weight:500}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr:nth-child(even) td:first-child{background:var(--bg-3)}
.hd{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.hd .txt{text-align:right}
.hd .ent{display:block;font-size:15px}
.hd .sub{display:block;color:var(--muted);font-size:12px;font-weight:400}
.hd .x{width:22px;height:22px;line-height:20px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:14px;text-align:center}
.hd .x:hover{border-color:var(--accent);color:var(--accent)}
tr.group td{background:var(--bg-head)!important;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:6px 14px;border-top:1px solid var(--line)}
tr.stat td:first-child{cursor:pointer}
tr.stat td:first-child::before{content:"▸";display:inline-block;width:14px;color:var(--muted);font-size:11px}
tr.stat.open td:first-child::before{content:"▾";color:var(--accent)}
tr.stat.open td{background:var(--sel)!important}
tr.stat.open td:first-child{color:var(--accent);font-weight:600}
tr.fams td{padding:6px 14px 8px 28px;background:var(--sel)!important}
tr.fams .chips{gap:5px}
tr.fams .chip{font-size:12px;padding:4px 10px}
tr.split td:first-child{padding-left:28px;color:var(--muted);box-shadow:inset 3px 0 0 var(--accent)}
tr.split td{color:var(--muted)}
td.best{color:var(--best);font-weight:700}
tr.split td.best{color:var(--text)}
td.na{color:var(--muted);opacity:.5}
tr.info td{color:var(--muted)}
tr.info td b{color:var(--text);font-weight:600}
td .two{display:block;font-size:12px;color:var(--muted);font-weight:400}
td[title]{cursor:help}
.empty{padding:40px 18px;color:var(--muted);max-width:60ch;line-height:1.55}
.empty p+p{margin-top:.7em}
.empty b{color:var(--text);font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:600;display:none}
.toast.on{display:block}
@media (max-width:600px){
  .top,.controls,.bar{padding-left:10px;padding-right:10px}
  .wrap,.games{margin-left:10px;margin-right:10px}
  th,td{padding:8px 10px}
  th:first-child,td:first-child{min-width:160px}
}
</style>
</head>
<body>

<div class="top">
  <h1>NFL Matrix</h1>
  <span class="meta" id="meta">loading</span>
  <span class="note" id="note"></span>
  <span class="spacer"></span>
  <div class="themes" id="themes">
    <span class="lbl">Theme</span>
    <button class="sw" data-t="colts" title="Colts"></button>
    <button class="sw" data-t="slate" title="Slate"></button>
    <button class="sw" data-t="broadcast" title="Broadcast"></button>
    <button class="sw" data-t="turf" title="Turf"></button>
    <button class="sw" data-t="paper" title="Paper"></button>
  </div>
</div>

<div class="controls">
  <div class="field">
    <span class="lbl">Compare</span>
    <div class="seg" id="modeSeg">
      <button data-mode="players" class="on">Players</button>
      <button data-mode="teams">Teams</button>
    </div>
  </div>
  <div class="field search">
    <label class="lbl" for="q" id="qLabel">Add a player: name, or a team to browse its roster</label>
    <input id="q" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Jonathan Taylor, Colts, IND">
    <div class="drop" id="drop" role="listbox"></div>
  </div>
  <div class="field" id="posField">
    <span class="lbl">Position</span>
    <div class="chips" id="posChips">
      <button class="chip on" data-pos="">All</button>
      <button class="chip" data-pos="QB">QB</button>
      <button class="chip" data-pos="RB">RB</button>
      <button class="chip" data-pos="WR">WR</button>
      <button class="chip" data-pos="TE">TE</button>
    </div>
  </div>
  <div class="field" id="weekField" style="display:none">
    <span class="lbl">Or add a matchup</span>
    <select id="weekSel"></select>
  </div>
</div>
<div class="games" id="games" style="display:none"></div>

<div class="bar">
  <div class="seg" id="viewSeg">
    <button data-view="total" class="on">Totals</button>
    <button data-view="pg">Per game</button>
  </div>
  <span class="hint">Tap a stat name to split it. Bold is the best in the row.</span>
  <span class="spacer"></span>
  <button class="btn" id="btnCopy">Copy JSON</button>
  <button class="btn" id="btnClear">Clear</button>
</div>

<div class="wrap" id="matrix"></div>
<div class="toast" id="toast"></div>

<script>
const DATA = 'data/';
const MAX_COLS = 8;
const THEMES = ['colts','slate','broadcast','turf','paper'];

const FAMS = [
  {id:'ha',  label:'Home / away', keys:[['home','Home'],['away','Away']]},
  {id:'div', label:'Division',    keys:[['div','In division'],['nondiv','Outside division']]},
  {id:'opp', label:'Opponent D',  keys:[['opp_top','vs top-10 defense'],['opp_mid','vs middle defense'],['opp_bot','vs bottom-10 defense']]},
  {id:'fav', label:'Fav / dog',   keys:[['fav','As favorite'],['dog','As underdog']]},
  {id:'rest',label:'Rest',        keys:[['rest_short','Short rest'],['rest_norm','Normal rest'],['rest_long','Long rest']]},
  {id:'roof',label:'Roof',        keys:[['dome','Indoors'],['outdoor','Outdoors']]},
];

// fmt: int | d1 | d2 | pct | pct100 (already 0-100) | rec | ratio.  avg: per-game rate, averaged.  low: lower is better.
const ROWS = {
  players: [
    {group:'Passing'},
    {key:'passing_yards', pos:'QB', label:'Passing yards', fmt:'int'},
    {key:'passing_tds', pos:'QB', label:'Passing TD', fmt:'int'},
    {key:'passing_interceptions', pos:'QB', label:'Interceptions', fmt:'int', low:true},
    {key:'completions', pos:'QB', label:'Completions', fmt:'int'},
    {key:'attempts', pos:'QB', label:'Attempts', fmt:'int'},
    {key:'passing_air_yards', pos:'QB', label:'Air yards', fmt:'int'},
    {key:'passing_epa', pos:'QB', label:'Passing EPA', fmt:'d1'},
    {key:'passing_cpoe', pos:'QB', label:'CPOE', fmt:'d1', avg:true, tip:'Completion % over expected'},
    {key:'sacks_suffered', pos:'QB', label:'Sacks taken', fmt:'int', low:true},
    {group:'Rushing'},
    {key:'carries', pos:'QBRB', label:'Carries', fmt:'int'},
    {key:'rushing_yards', pos:'QBRB', label:'Rushing yards', fmt:'int'},
    {key:'rushing_tds', pos:'QBRB', label:'Rushing TD', fmt:'int'},
    {key:'rushing_first_downs', pos:'QBRB', label:'Rushing first downs', fmt:'int'},
    {key:'rushing_epa', pos:'QBRB', label:'Rushing EPA', fmt:'d1'},
    {group:'Receiving'},
    {key:'targets', pos:'RBWRTE', label:'Targets', fmt:'int'},
    {key:'receptions', pos:'RBWRTE', label:'Receptions', fmt:'int'},
    {key:'receiving_yards', pos:'RBWRTE', label:'Receiving yards', fmt:'int'},
    {key:'receiving_tds', pos:'RBWRTE', label:'Receiving TD', fmt:'int'},
    {key:'receiving_air_yards', pos:'RBWRTE', label:'Air yards', fmt:'int'},
    {key:'receiving_yards_after_catch', pos:'RBWRTE', label:'Yards after catch', fmt:'int'},
    {key:'receiving_first_downs', pos:'RBWRTE', label:'Receiving first downs', fmt:'int'},
    {key:'receiving_epa', pos:'RBWRTE', label:'Receiving EPA', fmt:'d1'},
    {group:'Usage'},
    {key:'target_share', pos:'RBWRTE', label:'Target share', fmt:'pct', avg:true},
    {key:'air_yards_share', pos:'RBWRTE', label:'Air yards share', fmt:'pct', avg:true},
    {key:'wopr', pos:'RBWRTE', label:'WOPR', fmt:'d2', avg:true, tip:'Weighted opportunity: 1.5 x target share + 0.7 x air yards share'},
    {key:'fantasy_points_ppr', label:'Fantasy points (PPR)', fmt:'d1'},
    {group:'Next Gen Stats'},
    {key:'ngs_avg_time_to_throw', pos:'QB', label:'Time to throw', fmt:'d2', avg:true, unit:'s', tip:'Seconds from snap to release'},
    {key:'ngs_avg_intended_air_yards', pos:'QB', label:'Intended air yards', fmt:'d1', avg:true, tip:'Average depth of target'},
    {key:'ngs_aggressiveness', pos:'QB', label:'Aggressiveness', fmt:'pct100', avg:true, tip:'% of throws into tight coverage (defender within 1 yard)'},
    {key:'ngs_avg_air_yards_to_sticks', pos:'QB', label:'Air yards to sticks', fmt:'d1', avg:true, tip:'Throw depth relative to the first-down marker'},
    {key:'ngs_completion_percentage_above_expectation', pos:'QB', label:'Comp % over expected', fmt:'d1', avg:true, tip:'NGS version of CPOE'},
    {key:'ngs_max_completed_air_distance', pos:'QB', label:'Longest completed air distance', fmt:'d1', avg:true},
    {key:'ngs_rush_yards_over_expected', pos:'RBQB', label:'Rush yards over expected', fmt:'d1', tip:'Yards beyond what blocking and defenders predicted'},
    {key:'ngs_rush_yards_over_expected_per_att', pos:'RBQB', label:'RYOE per carry', fmt:'d2', avg:true},
    {key:'ngs_rush_pct_over_expected', pos:'RBQB', label:'Carries over expected', fmt:'pct', avg:true, tip:'% of carries that beat expectation'},
    {key:'ngs_efficiency', pos:'RBQB', label:'Rushing efficiency', fmt:'d2', avg:true, low:true, tip:'Yards traveled per yard gained. Lower is more north-south.'},
    {key:'ngs_percent_attempts_gte_eight_defenders', pos:'RBQB', label:'Stacked boxes faced', fmt:'pct100', avg:true, tip:'% of carries vs 8+ defenders in the box'},
    {key:'ngs_avg_time_to_los', pos:'RBQB', label:'Time to line of scrimmage', fmt:'d2', avg:true, unit:'s', low:true},
    {key:'ngs_avg_separation', pos:'RBWRTE', label:'Separation', fmt:'d1', avg:true, tip:'Yards from nearest defender at catch or incompletion'},
    {key:'ngs_avg_cushion', pos:'RBWRTE', label:'Cushion', fmt:'d1', avg:true, tip:'Yards from nearest defender at the snap'},
    {key:'ngs_percent_share_of_intended_air_yards', pos:'RBWRTE', label:'Share of intended air yards', fmt:'pct100', avg:true},
    {key:'ngs_avg_yac_above_expectation', pos:'RBWRTE', label:'YAC over expected', fmt:'d1', avg:true, tip:'Yards after catch beyond what the situation predicted'},
  ],
  teams: [
    {group:'Results'},
    {key:'win', label:'Record', fmt:'rec'},
    {key:'pf', label:'Points scored', fmt:'int'},
    {key:'pa', label:'Points allowed', fmt:'int', low:true},
    {key:'margin', label:'Point margin', fmt:'int'},
    {group:'Betting'},
    {key:'ats', label:'Against the spread', fmt:'rec'},
    {key:'ou_over', label:'Overs hit', fmt:'rec'},
    {key:'pf_vs_implied', label:'Points vs implied total', fmt:'d1', tip:'Points scored minus the total the line implied'},
    {group:'Offense'},
    {key:'yards_per_play', label:'Yards per play', fmt:'ratio'},
    {key:'total_yards', label:'Total yards', fmt:'int'},
    {key:'passing_yards', label:'Passing yards', fmt:'int'},
    {key:'rushing_yards', label:'Rushing yards', fmt:'int'},
    {key:'plays', label:'Plays', fmt:'int'},
    {key:'passing_epa', label:'Passing EPA', fmt:'d1'},
    {key:'rushing_epa', label:'Rushing EPA', fmt:'d1'},
    {key:'sacks_suffered', label:'Sacks allowed', fmt:'int', low:true},
    {group:'Turnovers and defense'},
    {key:'to_margin', label:'Turnover margin', fmt:'int'},
    {key:'giveaways', label:'Giveaways', fmt:'int', low:true},
    {key:'takeaways', label:'Takeaways', fmt:'int'},
    {key:'def_sacks', label:'Sacks', fmt:'int'},
    {key:'penalty_yards', label:'Penalty yards', fmt:'int', low:true},
  ],
};

const S = {mode:'players', view:'total', pos:'', cols:[], open:{}, data:{}, next:{}, sugg:[], cur:-1, week:null};
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v != null) e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null && k !== '') e.append(k);
  return e;
};
const T = id => S.data.teams[id] || {};
const nick = id => T(id).nick || id;

// ---------------------------------------------------------------- theme
function setTheme(t, save=true) {
  if (!THEMES.includes(t)) t = 'colts';
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if (save) { try { localStorage.setItem('nfl-theme', t); } catch (e) {} }
}
try { setTheme(localStorage.getItem('nfl-theme') || 'colts', false); } catch (e) { setTheme('colts', false); }
document.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.t)));

// ---------------------------------------------------------------- logos
function logo(id, cls='logo') {
  const t = T(id);
  const fb = el('span', {class:'abbr', style:'background:' + (t.color || '#555') + ';width:' + (cls.includes('lg') ? 36 : cls.includes('sm') ? 18 : 24) + 'px;height:' + (cls.includes('lg') ? 36 : cls.includes('sm') ? 18 : 24) + 'px'}, id);
  if (!t.logo) return fb;
  const img = el('img', {class:cls, src:t.logo, alt:t.name || id, loading:'lazy', referrerpolicy:'no-referrer'});
  img.addEventListener('error', () => img.replaceWith(fb));
  return img;
}

// ---------------------------------------------------------------- load
async function load() {
  const [meta, schedule, teams, players] = await Promise.all(
    ['meta','schedule','teams','players'].map(n => fetch(DATA + n + '.json', {cache:'no-cache'}).then(r => {
      if (!r.ok) throw new Error(n + '.json ' + r.status);
      return r.json();
    }))
  );
  S.data = {meta, schedule, teams, players};
  S.week = meta.current_week;
  for (const g of (schedule[String(meta.current_week)] || [])) {
    S.next[g.home] = {opp:g.away, at:'vs', spread:g.spread == null ? null : -g.spread, total:g.total, implied:g.home_implied};
    S.next[g.away] = {opp:g.home, at:'@',  spread:g.spread, total:g.total, implied:g.away_implied};
  }
  readHash();
  renderMeta(); renderControls(); renderTools(); render();
}

function renderMeta() {
  const m = S.data.meta;
  const stamp = new Date(m.updated).toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit', timeZone:'America/New_York'});
  $('#meta').textContent = m.season + ' season · Week ' + m.current_week + ' · data ' + stamp + ' ET';
  $('#note').textContent = m.note ? '(' + m.note + ')' : '';
}

// ---------------------------------------------------------------- controls
function renderControls() {
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode));
  $('#posField').style.display = S.mode === 'players' ? '' : 'none';
  $('#weekField').style.display = S.mode === 'teams' ? '' : 'none';
  $('#games').style.display = S.mode === 'teams' ? '' : 'none';
  $('#qLabel').textContent = S.mode === 'players' ? 'Add a player: name, or a team to browse its roster' : 'Add a team';
  $('#q').placeholder = S.mode === 'players' ? 'Jonathan Taylor, Colts, IND' : 'Colts, IND';
  document.querySelectorAll('#posChips .chip').forEach(b => b.classList.toggle('on', b.dataset.pos === S.pos));
  if (S.mode === 'teams') {
    const sel = $('#weekSel');
    sel.replaceChildren(...S.data.meta.weeks.map(w => el('option', {value:w}, 'Week ' + w)));
    sel.value = S.week;
    renderGames();
  }
}
function renderGames() {
  const games = S.data.schedule[String(S.week)] || [];
  $('#games').replaceChildren(...games.map(g => {
    const line = g.spread == null ? 'no line' : (g.spread > 0 ? g.home + ' -' + g.spread : g.away + ' -' + (-g.spread)) + (g.total == null ? '' : ' · o/u ' + g.total);
    const when = g.played ? 'Final ' + g.away_score + '-' + g.home_score : (g.day ? g.day.slice(0,3) + ' ' : '') + (g.time ? fmtTime(g.time) : '') + ' · ' + line;
    return el('button', {onclick:()=>addCols([g.away, g.home])},
      el('span', {class:'t'}, logo(g.away, 'logo sm'), g.away, ' @ ', logo(g.home, 'logo sm'), g.home),
      el('span', {class:'m'}, when));
  }));
}
function fmtTime(t) { const [h, m] = t.split(':').map(Number); const hh = h % 12 || 12; return hh + ':' + String(m).padStart(2,'0') + (h >= 12 ? 'p' : 'a'); }

document.querySelectorAll('#modeSeg button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
document.querySelectorAll('#posChips .chip').forEach(b => b.addEventListener('click', () => {
  S.pos = b.dataset.pos; renderControls();
  if ($('#q').value) { S.sugg = search($('#q').value); S.cur = S.sugg.length ? 0 : -1; renderDrop(); }
}));
$('#weekSel').addEventListener('change', e => { S.week = +e.target.value; renderGames(); });

function setMode(m) {
  if (m === S.mode) return;
  S.mode = m; S.cols = []; S.open = {}; S.pos = '';
  $('#q').value = ''; S.sugg = []; renderDrop();
  renderControls(); renderTools(); render(); writeHash();
}

// ---------------------------------------------------------------- hash
function writeHash() { history.replaceState(null, '', '#' + S.mode + ':' + S.cols.join(',')); }
function readHash() {
  const h = location.hash.slice(1); if (!h) return;
  const [mode, ids] = h.split(':');
  if (mode === 'players' || mode === 'teams') S.mode = mode;
  const pool = S.data[S.mode];
  S.cols = (ids || '').split(',').filter(id => pool[id]);
}
window.addEventListener('hashchange', () => { if (S.data.meta) { S.open = {}; readHash(); renderControls(); renderTools(); render(); } });

// ---------------------------------------------------------------- search
const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g, '');
function teamMatch(q) {
  return Object.keys(S.data.teams).filter(id => {
    const t = T(id);
    const words = ((t.name || '') + ' ' + (t.nick || '')).toLowerCase().split(' ');
    return id.toLowerCase() === q || (q.length >= 2 && id.toLowerCase().startsWith(q)) || words.some(w => w.startsWith(q));
  });
}
const ppr = p => p.stats.fantasy_points_ppr?.t || 0;

function search(raw) {
  const q = norm(raw.trim());
  if (!q) return [];
  if (S.mode === 'teams') {
    return teamMatch(q).map(id => ({id, label:T(id).name || id, meta: rec(T(id).stats?.win) || '0-0', team:id}));
  }
  const P = Object.values(S.data.players).filter(p => !S.pos || p.pos === S.pos);
  const teams = teamMatch(q);
  let list;
  if (teams.length === 1 && q.length >= 2) {
    list = P.filter(p => p.team === teams[0]);
    const order = {QB:0,RB:1,WR:2,TE:3};
    list.sort((a,b) => order[a.pos]-order[b.pos] || ppr(b)-ppr(a));
  } else {
    const parts = q.split(' ');
    list = P.filter(p => {
      const toks = (norm(p.name) + ' ' + p.pos.toLowerCase() + ' ' + p.team.toLowerCase()).split(' ');
      return parts.every(w => toks.some(t => t.startsWith(w)));
    });
    list.sort((a,b) => ppr(b)-ppr(a));
  }
  return list.slice(0, 40).map(p => ({id:p.id, label:p.name, pos:p.pos, meta:p.games + ' games', team:p.team}));
}

function renderDrop() {
  const box = $('#drop'); box.replaceChildren();
  if (!S.sugg.length) { box.classList.remove('open'); return; }
  S.sugg.forEach((s, i) => box.append(el('button', {class: i===S.cur ? 'cur':'', role:'option', onmousedown:e=>e.preventDefault(), onclick:()=>pick(s)},
    logo(s.team), el('span', {}, s.label), el('span', {class:'m'}, s.pos ? el('b', {}, s.pos) : '', s.meta))));
  box.classList.add('open');
}
function pick(s) { addCols([s.id]); $('#q').value = ''; S.sugg = []; S.cur = -1; renderDrop(); }
function addCols(ids) {
  for (const id of ids) if (!S.cols.includes(id)) S.cols.push(id);
  if (S.cols.length > MAX_COLS) { S.cols = S.cols.slice(-MAX_COLS); toast('Showing the last ' + MAX_COLS + ' columns'); }
  render(); writeHash();
}

const q = $('#q');
q.addEventListener('input', () => { S.sugg = search(q.value); S.cur = S.sugg.length ? 0 : -1; renderDrop(); });
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && S.sugg.length) { e.preventDefault(); S.cur = (S.cur+1) % S.sugg.length; renderDrop(); }
  else if (e.key === 'ArrowUp' && S.sugg.length) { e.preventDefault(); S.cur = (S.cur-1+S.sugg.length) % S.sugg.length; renderDrop(); }
  else if (e.key === 'Enter') { e.preventDefault(); const s = S.sugg[S.cur]; if (s) pick(s); }
  else if (e.key === 'Escape') { q.value=''; S.sugg=[]; renderDrop(); }
});
q.addEventListener('blur', () => setTimeout(() => { S.sugg=[]; renderDrop(); }, 150));
q.addEventListener('focus', () => { if (q.value) { S.sugg = search(q.value); renderDrop(); } });

// ---------------------------------------------------------------- tools
function renderTools() {
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
}
document.querySelectorAll('#viewSeg button').forEach(b => b.addEventListener('click', () => { S.view = b.dataset.view; renderTools(); render(); }));
$('#btnCopy').addEventListener('click', copyJson);
$('#btnClear').addEventListener('click', () => { S.cols = []; S.open = {}; render(); writeHash(); });

// ---------------------------------------------------------------- formatting
function fmtVal(v, f, unit) {
  if (v == null || Number.isNaN(v)) return null;
  let s;
  switch (f) {
    case 'int': s = Math.round(v).toLocaleString(); break;
    case 'd1': s = (Math.round(v*10)/10).toFixed(1); break;
    case 'd2': s = v.toFixed(2); break;
    case 'pct': s = (v*100).toFixed(1) + '%'; break;
    case 'pct100': s = v.toFixed(1) + '%'; break;
    case 'ratio': s = v.toFixed(2); break;
    default: s = String(v);
  }
  return unit ? s + unit : s;
}
function rec(st) {
  if (!st || !st.g) return null;
  const w = Math.floor(st.t), ties = Math.round((st.t - w) * 2), l = st.g - w - ties;
  return ties ? `${w}-${l}-${ties}` : `${w}-${l}`;
}
function cell(row, st) {
  if (!st || !st.g) return null;
  if (row.fmt === 'rec') return {main: rec(st), sub: Math.round(st.t/st.g*100) + '%', sort: st.t/st.g};
  if (row.fmt === 'ratio') return {main: fmtVal(st.t, 'ratio'), sort: st.t};
  const pg = st.t / st.g;
  if (row.avg) return {main: fmtVal(pg, row.fmt, row.unit), sort: pg};
  if (S.view === 'pg') return {main: fmtVal(pg, row.fmt === 'int' ? 'd1' : row.fmt, row.unit), sort: pg};
  return {main: fmtVal(st.t, row.fmt, row.unit), sort: st.t};
}
function onPos(e, row) { return S.mode === 'teams' || !row.pos || row.pos.includes(e.pos); }
function getStat(e, row) {
  if (!onPos(e, row)) return null;
  const st = e.stats[row.key];
  if (st) return st;
  if (row.key.startsWith('ngs_')) return null;   // NGS has a minimum-attempts threshold; absent means not measured, not zero
  return {t:0, g:e.games, s:{}};
}
function visibleRows(ents) {
  const out = []; let group = null;
  for (const r of ROWS[S.mode]) {
    if (r.group) { group = r; continue; }
    if (!ents.some(e => getStat(e, r))) continue;
    if (group) { out.push(group); group = null; }
    out.push(r);
  }
  return out;
}

// ---------------------------------------------------------------- matrix
function render() {
  const wrap = $('#matrix');
  const pool = S.data[S.mode];
  const ents = S.cols.map(id => pool[id]).filter(Boolean);

  if (!ents.length) {
    wrap.replaceChildren(el('div', {class:'empty'},
      el('p', {}, S.mode === 'players'
        ? 'Add a player above to start. Type a name, or a team name to see its roster, and tap a result. Add more to compare side by side.'
        : 'Add a team above to start, or pick a week and tap a game to add both teams.'),
      el('p', {}, el('b', {}, 'Splits: '), 'tap any stat name in the table and pick home/away, division, opponent defense, spread, rest, or roof. The breakdown appears right under it.'),
      el('p', {}, el('b', {}, 'Next Gen Stats: '), 'player tracking numbers like rush yards over expected, time to throw, and separation, in their own section at the bottom.'),
    ));
    return;
  }

  const thead = el('thead'); const hr = el('tr');
  hr.append(el('th', {}, S.mode === 'players' ? 'Player' : 'Team'));
  ents.forEach((e, i) => {
    const x = el('button', {class:'x', title:'Remove', 'aria-label':'Remove', onclick:()=>{ S.cols.splice(i,1); render(); writeHash(); }}, '×');
    const isP = S.mode === 'players';
    const teamId = isP ? e.team : e.id;
    hr.append(el('th', {}, el('div', {class:'hd'},
      logo(teamId, 'logo lg'),
      el('div', {class:'txt'},
        el('span', {class:'ent'}, isP ? e.name : nick(e.id)),
        el('span', {class:'sub'}, isP ? e.pos + ' · ' + nick(e.team) + ' · ' + e.games + ' gm' : e.id + ' · ' + (rec(e.stats.win) || '0-0'))),
      x)));
  });
  thead.append(hr);

  const tbody = el('tbody');
  if (S.mode === 'teams') {
    const tr = el('tr', {class:'info'}); tr.append(el('td', {}, 'Week ' + S.data.meta.current_week));
    ents.forEach(e => {
      const n = S.next[e.id];
      if (!n) { tr.append(el('td', {class:'na'}, 'Bye')); return; }
      const sp = n.spread == null ? '' : ' ' + (n.spread > 0 ? '+' : '') + n.spread;
      tr.append(el('td', {}, el('b', {}, n.at + ' ' + n.opp + sp), el('span', {class:'two'}, n.total == null ? '' : 'O/U ' + n.total + ' · implied ' + n.implied)));
    });
    tbody.append(tr);
    const tf = el('tr', {class:'info'}); tf.append(el('td', {}, 'Last 5 games'));
    ents.forEach(e => {
      const f = (e.form || []).slice(-5);
      tf.append(el('td', {}, el('b', {}, f.map(x => x.w).join(' ') || '–'), el('span', {class:'two'}, 'ATS ' + (f.map(x => ({C:'W', X:'L', P:'P'})[x.ats] || '–').join(' ') || '–'))));
    });
    tbody.append(tf);
  }

  for (const row of visibleRows(ents)) {
    if (row.group) { const tr = el('tr', {class:'group'}); tr.append(el('td', {colspan: ents.length + 1}, row.group)); tbody.append(tr); continue; }
    const vals = ents.map(e => cell(row, getStat(e, row)));
    const isOpen = !!S.open[row.key];
    tbody.append(statRow(row, row.label, vals, 'stat' + (isOpen ? ' open' : ''), () => {
      if (isOpen) delete S.open[row.key]; else S.open[row.key] = S.open[row.key] || 'ha';
      render();
    }));
    if (isOpen) {
      const fr = el('tr', {class:'fams'}); const td = el('td', {colspan: ents.length + 1}); const chips = el('div', {class:'chips'});
      for (const f of FAMS) chips.append(el('button', {class:'chip' + (S.open[row.key] === f.id ? ' on' : ''), onclick:()=>{ S.open[row.key] = f.id; render(); }}, f.label));
      td.append(chips); fr.append(td); tbody.append(fr);
      const F = FAMS.find(f => f.id === S.open[row.key]);
      for (const [k, lab] of F.keys) {
        const sv = ents.map(e => { const st = getStat(e, row); const s = st && st.s && st.s[k]; return s ? cell(row, {t:s[0], g:s[1]}) : null; });
        if (sv.every(v => !v)) continue;
        tbody.append(statRow(row, lab, sv, 'split'));
      }
    }
  }

  const table = el('table'); table.append(thead, tbody);
  wrap.replaceChildren(table);
}

function statRow(row, label, vals, cls, onclick) {
  const tr = el('tr', {class:cls});
  const first = el('td', {title: onclick && row.tip ? row.tip : null}, label);
  if (onclick) { first.addEventListener('click', onclick); first.tabIndex = 0; first.setAttribute('role','button'); first.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); onclick(); } }); }
  tr.append(first);
  const nums = vals.map(v => v ? v.sort : null).filter(v => v != null);
  const best = nums.length > 1 ? (row.low ? Math.min(...nums) : Math.max(...nums)) : null;
  vals.forEach(v => {
    if (!v) { tr.append(el('td', {class:'na'}, '–')); return; }
    const td = el('td', {class: best != null && v.sort === best ? 'best' : ''}, v.main);
    if (v.sub) td.append(el('span', {class:'two'}, v.sub));
    tr.append(td);
  });
  return tr;
}

// ---------------------------------------------------------------- copy
function copyJson() {
  const pool = S.data[S.mode];
  const ents = S.cols.map(id => pool[id]).filter(Boolean);
  if (!ents.length) { toast('Nothing to copy yet'); return; }
  const rows = visibleRows(ents).filter(r => r.key);
  const out = {
    season: S.data.meta.season, week: S.data.meta.current_week, mode: S.mode,
    stat_shape: 't = season total (or sum of per-game values for avg stats), g = games, s = splits as [total, games]',
    splits: Object.fromEntries(FAMS.flatMap(f => f.keys)),
    entities: ents.map(e => ({
      id: e.id, name: e.name || T(e.id).name, pos: e.pos, team: e.team, games: e.games,
      this_week: S.mode === 'teams' ? S.next[e.id] : undefined,
      stats: Object.fromEntries(rows.map(r => [r.key, getStat(e, r)]).filter(x => x[1])),
    })),
  };
  const txt = JSON.stringify(out, null, 1);
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(
    () => toast('Copied ' + ents.length + ' columns as JSON'),
    () => { const ta = el('textarea', {style:'position:fixed;opacity:0'}, txt); document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Copied'); }
  );
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2000); }

load().catch(e => { $('#meta').textContent = 'Data not found (' + e.message + '). Run the "pull nfl data" workflow once.'; });
</script>
</body>
